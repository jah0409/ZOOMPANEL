<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ZoomFill — Zoom Bot SaaS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:      #0a0a0f;
    --surface: #111118;
    --surface2:#16161f;
    --border:  #1e1e2e;
    --accent:  #4f6ef7;
    --accent2: #7c3aed;
    --green:   #22c55e;
    --red:     #ef4444;
    --yellow:  #f59e0b;
    --text:    #e2e8f0;
    --muted:   #64748b;
    --mono:    'Space Mono', monospace;
    --sans:    'DM Sans', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(79,110,247,0.03) 1px, transparent 1px),
      linear-gradient(90deg,rgba(79,110,247,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events:none; z-index:0;
  }
  .orb { position:fixed; border-radius:50%; filter:blur(120px); pointer-events:none; z-index:0; opacity:0.12; }
  .orb-1 { width:600px; height:600px; background:var(--accent); top:-200px; right:-200px; }
  .orb-2 { width:400px; height:400px; background:var(--accent2); bottom:-100px; left:-100px; }

  .container { position:relative; z-index:1; max-width:1040px; margin:0 auto; padding:60px 24px; }

  /* ── Header ── */
  header { text-align:center; margin-bottom:52px; animation:fadeUp 0.6s ease both; }
  .logo { display:inline-flex; align-items:center; gap:10px; margin-bottom:20px; }
  .logo-icon { width:40px; height:40px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .logo-text { font-family:var(--mono); font-size:22px; font-weight:700; letter-spacing:-0.5px; }
  .logo-text span { color:var(--accent); }
  h1 { font-size:clamp(26px,5vw,42px); font-weight:600; line-height:1.1; letter-spacing:-1px; margin-bottom:14px; }
  h1 em { font-style:normal; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .subtitle { color:var(--muted); font-size:15px; max-width:480px; margin:0 auto; line-height:1.6; }

  /* ── Nav tabs ── */
  .nav-tabs { display:flex; gap:4px; margin-bottom:24px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; width:fit-content; }
  .nav-tab { padding:8px 20px; border-radius:8px; font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; border:none; background:transparent; color:var(--muted); transition:all 0.2s; }
  .nav-tab.active { background:var(--accent); color:#fff; }

  /* ── Main grid ── */
  .panel { display:none; }
  .panel.active { display:block; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  @media(max-width:640px){ .grid { grid-template-columns:1fr; } }

  /* ── Card ── */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; animation:fadeUp 0.6s ease both; }
  .card:nth-child(2){ animation-delay:0.1s; }
  .card-title { font-family:var(--mono); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:20px; display:flex; align-items:center; gap:8px; }
  .card-title::after { content:''; flex:1; height:1px; background:var(--border); }

  /* ── Form ── */
  .field { margin-bottom:18px; }
  label { display:block; font-size:12px; font-weight:600; letter-spacing:0.5px; color:var(--muted); margin-bottom:7px; text-transform:uppercase; }
  input[type=text],input[type=url],input[type=number] { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 14px; color:var(--text); font-family:var(--sans); font-size:14px; outline:none; transition:border-color 0.2s,box-shadow 0.2s; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,110,247,0.15); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  /* ── Name style selector ── */
  .name-style-group { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .ns-option { position:relative; }
  .ns-option input[type=radio] { position:absolute; opacity:0; width:0; height:0; }
  .ns-label {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; padding:10px 6px;
    background:var(--bg); border:1px solid var(--border); border-radius:8px;
    cursor:pointer; transition:all 0.2s; text-align:center;
  }
  .ns-label:hover { border-color:var(--muted); }
  .ns-option input[type=radio]:checked + .ns-label {
    border-color:var(--accent);
    background:rgba(79,110,247,0.08);
    box-shadow:0 0 0 2px rgba(79,110,247,0.2);
  }
  .ns-flag { font-size:18px; line-height:1; }
  .ns-text { font-family:var(--mono); font-size:10px; letter-spacing:0.5px; color:var(--muted); text-transform:uppercase; }
  .ns-option input[type=radio]:checked + .ns-label .ns-text { color:var(--accent); }

  /* ── Toggle ── */
  .toggle-field { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--bg); border:1px solid var(--border); border-radius:8px; }
  .toggle-label { font-size:14px; color:var(--text); }
  .toggle { position:relative; width:40px; height:22px; cursor:pointer; }
  .toggle input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:var(--border); border-radius:22px; transition:background 0.2s; }
  .slider::before { content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:transform 0.2s; }
  .toggle input:checked + .slider { background:var(--accent); }
  .toggle input:checked + .slider::before { transform:translateX(18px); }

  /* ── Buttons ── */
  .btn { width:100%; padding:13px; border:none; border-radius:10px; font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:1px; cursor:pointer; transition:all 0.2s; }
  .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; margin-top:8px; }
  .btn-primary:hover { opacity:0.9; transform:translateY(-1px); box-shadow:0 8px 24px rgba(79,110,247,0.3); }
  .btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  .btn-stop { background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); color:var(--red); margin-top:8px; display:none; }
  .btn-stop:hover { background:rgba(239,68,68,0.25); transform:translateY(-1px); }

  /* ── Status + terminal ── */
  .status-bar { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--bg); border:1px solid var(--border); border-radius:8px; margin-bottom:14px; font-size:13px; }
  .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .dot.idle    { background:var(--muted); }
  .dot.running { background:var(--green); animation:pulse 1.2s infinite; }
  .dot.error   { background:var(--red); }
  .dot.done    { background:var(--accent); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .terminal { background:#050508; border:1px solid var(--border); border-radius:10px; padding:16px; height:360px; overflow-y:auto; font-family:var(--mono); font-size:12px; line-height:1.7; scroll-behavior:smooth; }
  .terminal::-webkit-scrollbar { width:4px; }
  .terminal::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .log-line.win   { color:var(--green); }
  .log-line.error { color:var(--red); }
  .log-line.warn  { color:var(--yellow); }
  .log-line.info  { color:var(--accent); }
  .log-line.done  { color:var(--accent); font-weight:700; }
  .placeholder { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--muted); }
  .placeholder-icon { font-size:32px; opacity:0.4; }
  .placeholder-text { font-size:12px; letter-spacing:1px; text-transform:uppercase; }

  /* ── Name chips ── */
  .names-wrap { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .name-chip { font-size:11px; padding:3px 10px; background:rgba(79,110,247,0.1); border:1px solid rgba(79,110,247,0.2); border-radius:100px; color:var(--accent); font-family:var(--mono); }

  /* ── History panel ── */
  .history-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .history-header h2 { font-size:16px; font-weight:600; }
  .refresh-btn { padding:6px 14px; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--muted); font-family:var(--mono); font-size:11px; cursor:pointer; transition:all 0.2s; }
  .refresh-btn:hover { border-color:var(--accent); color:var(--accent); }
  .history-empty { text-align:center; padding:60px 0; color:var(--muted); }
  .history-empty-icon { font-size:36px; margin-bottom:12px; opacity:0.4; }
  .history-empty-text { font-size:13px; }
  .history-list { display:flex; flex-direction:column; gap:14px; }
  .history-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px 24px; transition:border-color 0.2s; }
  .history-card:hover { border-color:rgba(79,110,247,0.3); }
  .history-card-header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px; }
  .history-meta { flex:1; }
  .history-url { font-size:13px; color:var(--text); word-break:break-all; margin-bottom:5px; font-weight:400; }
  .history-time { font-size:11px; color:var(--muted); font-family:var(--mono); }
  .status-pill { padding:3px 10px; border-radius:100px; font-size:11px; font-family:var(--mono); font-weight:700; white-space:nowrap; }
  .status-pill.completed  { background:rgba(34,197,94,0.12);  color:var(--green);  border:1px solid rgba(34,197,94,0.2); }
  .status-pill.running    { background:rgba(79,110,247,0.12); color:var(--accent); border:1px solid rgba(79,110,247,0.2); }
  .status-pill.failed     { background:rgba(239,68,68,0.12);  color:var(--red);    border:1px solid rgba(239,68,68,0.2); }
  .status-pill.in_meeting { background:rgba(245,158,11,0.12); color:var(--yellow); border:1px solid rgba(245,158,11,0.2); }
  .status-pill.error      { background:rgba(239,68,68,0.12);  color:var(--red);    border:1px solid rgba(239,68,68,0.2); }
  .history-stats { display:flex; gap:20px; margin-bottom:14px; flex-wrap:wrap; }
  .stat { display:flex; flex-direction:column; gap:2px; }
  .stat-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
  .stat-value { font-size:13px; font-family:var(--mono); color:var(--text); }
  .bots-section {}
  .bots-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
  .bots-grid { display:flex; flex-wrap:wrap; gap:6px; }
  .bot-chip { font-size:11px; padding:3px 10px; background:var(--surface2); border:1px solid var(--border); border-radius:100px; color:var(--text); font-family:var(--mono); }

  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <div class="logo-text">Zoom<span>Fill</span></div>
    </div>
    <h1>Auto-join Zoom meetings<br/>with <em>multiple bots</em></h1>
    <p class="subtitle">Multiple browser contexts race to join. First one in wins — the rest close automatically.</p>
  </header>

  <!-- Nav -->
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('launch', this)">▶ Launch</button>
    <button class="nav-tab" onclick="switchTab('history', this)">🕘 History</button>
  </div>

  <!-- ══ LAUNCH PANEL ══ -->
  <div class="panel active" id="panel-launch">
    <div class="grid">

      <!-- Form card -->
      <div class="card">
        <div class="card-title">⚙ Configuration</div>

        <div class="field">
          <label>Meeting URL</label>
          <input type="url" id="meeting_url" placeholder="https://zoom.us/j/..."/>
        </div>

        <div class="field">
          <label>Passcode</label>
          <input type="text" id="passcode" placeholder="Leave blank if in URL"/>
        </div>

        <div class="row">
          <div class="field">
            <label>Number of bots</label>
            <input type="number" id="num_tabs" value="3" min="1" max="50"/>
          </div>
          <div class="field">
            <label>Stay (minutes)</label>
            <input type="number" id="stay_minutes" value="60" min="1"/>
          </div>
        </div>

        <!-- Name style selector -->
        <div class="field">
          <label>Bot name style</label>
          <div class="name-style-group">
            <div class="ns-option">
              <input type="radio" name="name_style" id="ns-indian" value="indian" checked/>
              <label class="ns-label" for="ns-indian">
                <span class="ns-flag">🇮🇳</span>
                <span class="ns-text">Indian</span>
              </label>
            </div>
            <div class="ns-option">
              <input type="radio" name="name_style" id="ns-foreign" value="foreign"/>
              <label class="ns-label" for="ns-foreign">
                <span class="ns-flag">🌍</span>
                <span class="ns-text">Foreign</span>
              </label>
            </div>
            <div class="ns-option">
              <input type="radio" name="name_style" id="ns-mix" value="mix"/>
              <label class="ns-label" for="ns-mix">
                <span class="ns-flag">🔀</span>
                <span class="ns-text">Mix</span>
              </label>
            </div>
          </div>
        </div>

        <!-- Headless toggle -->
        <div class="field">
          <div class="toggle-field">
            <span class="toggle-label">Headless mode (no UI)</span>
            <label class="toggle">
              <input type="checkbox" id="headless" checked/>
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <button class="btn btn-primary" id="startBtn" onclick="startBot()">▶ LAUNCH BOTS</button>
        <button class="btn btn-stop" id="stopBtn" onclick="stopBot()">⬛ STOP &amp; LEAVE</button>
        <div class="names-wrap" id="namesWrap"></div>
      </div>

      <!-- Logs card -->
      <div class="card">
        <div class="card-title">📡 Live Logs</div>
        <div class="status-bar">
          <div class="dot idle" id="statusDot"></div>
          <span id="statusText">Waiting to start...</span>
        </div>
        <div class="terminal" id="terminal">
          <div class="placeholder">
            <div class="placeholder-icon">🖥</div>
            <div class="placeholder-text">Logs will appear here</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ══ HISTORY PANEL ══ -->
  <div class="panel" id="panel-history">
    <div class="card">
      <div class="history-header">
        <h2>Past Sessions</h2>
        <button class="refresh-btn" onclick="loadHistory()">↻ Refresh</button>
      </div>
      <div id="historyContent">
        <div class="history-empty">
          <div class="history-empty-icon">📭</div>
          <div class="history-empty-text">Loading history...</div>
        </div>
      </div>
    </div>
  </div>

</div><!-- /container -->

<script>
  let eventSource      = null;
  let currentSessionId = null;
  let botsRunning      = false;

  // ── Warn before leaving while bots are running ──
  window.addEventListener('beforeunload', (e) => {
    if (botsRunning) {
      e.preventDefault();
      e.returnValue = 'Bots are still running! Leaving will not stop them on the server.';
      return e.returnValue;
    }
  });

  // ── Tab switching ──
  function switchTab(name, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    btn.classList.add('active');
    if (name === 'history') loadHistory();
  }

  // ── Status dot ──
  function setStatus(type, text) {
    document.getElementById('statusDot').className = `dot ${type}`;
    document.getElementById('statusText').textContent = text;
  }

  // ── Append a log line ──
  function addLog(msg) {
    const term = document.getElementById('terminal');
    if (term.querySelector('.placeholder')) term.innerHTML = '';
    const line = document.createElement('div');
    line.className = 'log-line';
    if      (msg.includes('🏆') || msg.includes('WON'))     line.classList.add('win');
    else if (msg.startsWith('ERROR') || msg.includes('❌'))  line.classList.add('error');
    else if (msg.includes('⚠️'))                             line.classList.add('warn');
    else if (msg.startsWith('DONE'))                         line.classList.add('done');
    else if (msg.includes('🟢') || msg.includes('⏱'))       line.classList.add('info');
    if (msg !== 'PING') { line.textContent = msg; term.appendChild(line); }
    term.scrollTop = term.scrollHeight;
  }

  // ── Get selected name style ──
  function getNameStyle() {
    const checked = document.querySelector('input[name="name_style"]:checked');
    return checked ? checked.value : 'indian';
  }

  // ── Launch bots ──
  async function startBot() {
    const btn = document.getElementById('startBtn');
    const url = document.getElementById('meeting_url').value.trim();
    if (!url) { alert('Please enter a meeting URL.'); return; }

    document.getElementById('terminal').innerHTML = '';
    document.getElementById('namesWrap').innerHTML = '';
    btn.disabled = true;
    btn.textContent = '⏳ LAUNCHING...';
    setStatus('running', 'Connecting...');
    if (eventSource) eventSource.close();

    const payload = {
      meeting_url:  url,
      passcode:     document.getElementById('passcode').value.trim(),
      num_tabs:     parseInt(document.getElementById('num_tabs').value) || 3,
      stay_minutes: parseInt(document.getElementById('stay_minutes').value) || 60,
      headless:     document.getElementById('headless').checked,
      name_style:   getNameStyle(),
    };

    const res  = await fetch('/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    currentSessionId = data.session_id;

    document.getElementById('stopBtn').style.display = 'block';

    const wrap = document.getElementById('namesWrap');
    data.names.forEach(n => {
      const chip = document.createElement('div');
      chip.className = 'name-chip';
      chip.textContent = n;
      wrap.appendChild(chip);
    });

    setStatus('running', 'Bots are running...');
    btn.textContent = '🔄 RUNNING...';
    botsRunning = true;

    eventSource = new EventSource(`/logs/${data.session_id}`);
    eventSource.onmessage = (e) => {
      addLog(e.data);
      if (e.data.startsWith('DONE:')) {
        setStatus('done', 'Session complete ✅');
        btn.disabled = false; btn.textContent = '▶ LAUNCH BOTS';
        document.getElementById('stopBtn').style.display = 'none';
        botsRunning = false;
        eventSource.close();
      }
      if (e.data.startsWith('ERROR:')) {
        setStatus('error', 'Error occurred ❌');
        btn.disabled = false; btn.textContent = '▶ LAUNCH BOTS';
        document.getElementById('stopBtn').style.display = 'none';
        botsRunning = false;
        eventSource.close();
      }
    };
    eventSource.onerror = () => {
      setStatus('error', 'Connection lost');
      btn.disabled = false; btn.textContent = '▶ LAUNCH BOTS';
      document.getElementById('stopBtn').style.display = 'none';
      botsRunning = false;
    };
  }

  // ── Stop bots ──
  async function stopBot() {
    if (!currentSessionId) return;
    const stopBtn = document.getElementById('stopBtn');
    stopBtn.textContent = '⏳ STOPPING...';
    stopBtn.disabled = true;
    botsRunning = false;

    if (eventSource) { eventSource.close(); eventSource = null; }
    await fetch(`/stop/${currentSessionId}`, { method: 'POST' });

    currentSessionId = null;
    setStatus('idle', 'Stopped.');
    addLog('🛑 Session terminated by user.');
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').textContent = '▶ LAUNCH BOTS';
    stopBtn.style.display = 'none';
    stopBtn.textContent = '⬛ STOP & LEAVE';
    stopBtn.disabled = false;
  }

  // ── Load history ──
  async function loadHistory() {
    const container = document.getElementById('historyContent');
    container.innerHTML = '<div class="history-empty"><div class="history-empty-icon">⏳</div><div class="history-empty-text">Loading...</div></div>';

    const res  = await fetch('/history');
    const data = await res.json();
    const list = data.history;

    if (!list || list.length === 0) {
      container.innerHTML = '<div class="history-empty"><div class="history-empty-icon">📭</div><div class="history-empty-text">No sessions yet — launch your first bot!</div></div>';
      return;
    }

    const statusLabel = {
      completed:  '✅ Completed',
      running:    '🔄 Running',
      failed:     '❌ Failed',
      in_meeting: '🟢 In Meeting',
      error:      '⚠️ Error',
    };

    const styleLabel = {
      indian:  '🇮🇳 Indian',
      foreign: '🌍 Foreign',
      mix:     '🔀 Mix',
    };

    container.innerHTML = `<div class="history-list">${list.map(s => `
      <div class="history-card">
        <div class="history-card-header">
          <div class="history-meta">
            <div class="history-url">${s.meeting_url}</div>
            <div class="history-time">${s.started_at}</div>
          </div>
          <div class="status-pill ${s.status}">${statusLabel[s.status] || s.status}</div>
        </div>
        <div class="history-stats">
          <div class="stat"><span class="stat-label">Bots</span><span class="stat-value">${s.num_tabs}</span></div>
          <div class="stat"><span class="stat-label">Duration</span><span class="stat-value">${s.stay_minutes} min</span></div>
          <div class="stat"><span class="stat-label">Mode</span><span class="stat-value">${s.headless ? 'Headless' : 'Headed'}</span></div>
          <div class="stat"><span class="stat-label">Names</span><span class="stat-value">${styleLabel[s.name_style] || '—'}</span></div>
        </div>
        <div class="bots-section">
          <div class="bots-label">Bots assigned</div>
          <div class="bots-grid">${(s.bots || []).map(n => `<div class="bot-chip">${n}</div>`).join('')}</div>
        </div>
      </div>
    `).join('')}</div>`;
  }
</script>
</body>
</html>
